[package]
name = "sonadial_player"
version = "0.1.0"
edition = "2021"
description = "Looks like a TUI, runs native. A terminal-styled music player with a beat-reactive radial spectrum, typewriter lyrics and gradient themes picked from each song's sound. Rust, single exe, lightweight."
authors = ["Ovalene"]
repository = "https://github.com/Ovalene2333/sonadial-player"

[dependencies]
anyhow = "1.0"
cpal = "0.18"
dirs = "7.0"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
rfd = "0.17"
ringbuf = "0.5"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.18"
symphonia = { version = "0.6", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
ureq = "2.12"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
